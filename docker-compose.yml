services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-db
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      ORACLE_DATABASE: appdb
      APP_USER: app_user
      APP_USER_PASSWORD: app_pass
    volumes:
      - ./db:/container-entrypoint-initdb.d
