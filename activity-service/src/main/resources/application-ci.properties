# Isolated in-memory database for CI testing
spring.datasource.url=jdbc:h2:mem:activity-ci;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate test schema
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Prevent connections to the shared Kafka topic
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false
spring.kafka.consumer.group-id=activity-service-ci
app.kafka.order-topic=activity-ci-test-events

# Isolated OAuth2 configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://issuer.example.invalid
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://issuer.example.invalid/jwks

# Disable service discovery
eureka.client.enabled=false