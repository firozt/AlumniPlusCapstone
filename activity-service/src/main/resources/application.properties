spring.application.name=activity-service

# Import envivonment variables
spring.config.import=optional:file:./.env[.properties]

# Oracle Datasource
spring.datasource.url=${DB_URL_ACTIVITY:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME_ACTIVITY:TEAM1_ACTIVITY}
spring.datasource.password=${DB_PASSWORD_ACTIVITY:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# Kafka connection
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# Consumer configuration
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:team1-activity-service}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false

# Deserialization
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Commit offsets after successful record processing
spring.kafka.listener.ack-mode=record

# Kafka topic
app.kafka.order-topic=${KAFKA_ORDER_TOPIC}