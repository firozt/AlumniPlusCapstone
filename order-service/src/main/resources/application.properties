# load .env file
spring.config.import=optional:file:./.env[.properties]

# Oracle datasource
spring.datasource.url=${DB_URL_ORDERS:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME_ORDERS:TEAM1_ORDERS}
spring.datasource.password=${DB_PASSWORD_ORDERS:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
app.kafka.orders-submitted-topic=${KAFKA_ORDERS_SUBMITTED_TOPIC:orders-submitted}

# OAuth2 resource server
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.3-111-205-87.sslip.io/realms/capstone

# Service discovery
eureka.client.enabled=false
spring.application.name=order-service
